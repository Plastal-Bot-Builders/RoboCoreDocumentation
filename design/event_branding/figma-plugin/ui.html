<!doctype html>
<html><body style="margin:0;font:12px Inter,system-ui,sans-serif;color:#1B2A41;background:#F2B01E;padding:8px">RoboCore event branding — asset bridge
<script>
const SERVER = 'http://localhost:8767';
const reply = (o) => parent.postMessage({ pluginMessage: o }, '*');
window.onmessage = async (ev) => {
  const m = ev.data && ev.data.pluginMessage;
  if (!m) return;
  try {
    if (m.type === 'ping') {
      const r = await fetch(SERVER + '/ping');
      reply({ type: 'pong', ok: r.ok });
    } else if (m.type === 'asset') {
      const r = await fetch(SERVER + '/asset?name=' + encodeURIComponent(m.name));
      if (!r.ok) { reply({ type: 'asset', name: m.name, ok: false, error: 'HTTP ' + r.status }); return; }
      reply({ type: 'asset', name: m.name, ok: true, bytes: new Uint8Array(await r.arrayBuffer()) });
    } else if (m.type === 'png') {
      await fetch(SERVER + '/save?name=' + encodeURIComponent(m.name), { method: 'POST', body: m.bytes });
      reply({ type: 'ack' });
    } else if (m.type === 'report') {
      await fetch(SERVER + '/save?name=report.json', { method: 'POST', body: JSON.stringify(m.report, null, 2) });
      reply({ type: 'ack' });
    }
  } catch (e) {
    reply({ type: m.type === 'ping' ? 'pong' : (m.type === 'asset' ? 'asset' : 'ack'), name: m.name, ok: false, error: String(e) });
  }
};
</script></body></html>
